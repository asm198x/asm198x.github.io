name: Pages

# Builds the site and deploys it to GitHub Pages with the workflow every 198x
# site shares (stevehill1981/198x-workflows). Pull requests build and check
# without deploying.
#
# The build fetches what it documents itself (scripts/fetch-asm198x.sh chooses
# the version) and takes the playground from the pinned @asm198x/web package,
# so nothing here compiles Rust. Asm198x dispatches docs-changed when its
# documentation moves or it releases; the daily run is the backstop.
on:
  pull_request:
  push:
    branches:
      - main
  repository_dispatch:
    types: [docs-changed]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Pages
    uses: stevehill1981/198x-workflows/.github/workflows/pages-astro.yml@v1
    with:
      browser-check-command: npm run a11y
